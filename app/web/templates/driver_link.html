<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Вход в приложение Condur</title>
<link rel="icon" href="/static/favicon-32.png?v={{ asset_v }}">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0b1120; color: #e8edf7;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { width: min(420px, 100% - 40px); text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 22px; margin: 18px 0 8px; }
  p { color: #9aa7bd; margin: 0 0 22px; }
  a.open { display: block; padding: 15px; border-radius: 14px; background: #2563eb;
           color: #fff; font-weight: 700; text-decoration: none; }
  ol { text-align: left; color: #9aa7bd; padding-left: 20px; margin: 26px 0 0; }
  li { margin: 6px 0; }
</style>
</head>
<body>
<main>
  <img src="/static/apple-touch-icon.png?v={{ asset_v }}" alt="">
  <h1>Вход в приложение Condur</h1>
  <p>Эта ссылка открывает приложение и сразу входит — без пароля.</p>
  <a class="open" href="condur://d/{{ token }}">Открыть в приложении</a>
  <ol>
    <li>Если кнопка не сработала — установите приложение Condur.</li>
    <li>Откройте его и выберите «Я водитель».</li>
    <li>Введите код, который вам передал владелец.</li>
  </ol>
</main>
</body>
</html>
